<title>GameTree</title>
<meta name="description" content="Глобальное дерево навыков: отмечай изученное, открывай новые ветки и повторяй темы.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@500;700&display=swap">
<style>/*STYLE*/</style>

<div id="app">
  <canvas id="stars" aria-hidden="true"></canvas>
  <svg id="map" role="application" aria-label="Карта навыков">
    <defs>
      <radialGradient id="coreGrad" cx="50%" cy="40%" r="65%">
        <stop offset="0%" stop-color="#ffe7a8"/>
        <stop offset="55%" stop-color="#d79b2b"/>
        <stop offset="100%" stop-color="#5a3a08"/>
      </radialGradient>
    </defs>
    <g id="world">
      <g id="layer-bg"></g>
      <g id="layer-edges"></g>
      <g id="layer-nodes"></g>
      <g id="layer-fx"></g>
    </g>
  </svg>

  <header id="hud">
    <div class="brand" aria-hidden="true"><span class="brand-mark">◆</span><span class="brand-name">GameTree</span></div>
    <div class="project-switch">
      <button id="projectBtn" class="chip-btn" aria-haspopup="menu" aria-expanded="false"><span id="projectTitle">…</span><span class="caret">▾</span></button>
      <div id="projectMenu" class="menu" role="menu" hidden></div>
    </div>
    <div class="search">
      <input id="search" type="search" placeholder="Найти навык или вопрос" autocomplete="off" aria-label="Поиск по навыкам">
      <div id="searchResults" class="menu" hidden></div>
    </div>
    <div class="hud-right">
      <div class="level" id="level" title="Опыт">
        <div class="level-badge"><span id="levelNum">1</span></div>
        <div class="level-meta">
          <div class="level-title" id="levelTitle">Стажёр</div>
          <div class="xpbar"><div id="xpFill"></div></div>
          <div class="xp-text" id="xpText">0 XP</div>
        </div>
      </div>
      <button id="reviewBtn" class="hud-btn" title="Повторение вопросов">⟳ <span class="lbl-wide">Повторение</span><span id="reviewCount" class="count" hidden></span></button>
      <button id="editBtn" class="hud-btn" aria-pressed="false" title="Режим редактора">✎ <span class="lbl-wide">Редактор</span></button>
      <div class="more">
        <button id="moreBtn" class="hud-btn icon" aria-haspopup="menu" aria-expanded="false" title="Ещё">⋯</button>
        <div id="moreMenu" class="menu right" role="menu" hidden>
          <button data-act="export-progress">Сохранить прогресс в файл</button>
          <button data-act="import-progress">Загрузить прогресс из файла</button>
          <button data-act="onboarding">Отметить изученные ветки</button>
          <button data-act="help">Как пользоваться</button>
          <hr>
          <button data-act="reset-progress" class="danger">Сбросить прогресс проекта</button>
        </div>
      </div>
    </div>
  </header>

  <div id="editbar" hidden>
    <span class="editbar-title">Редактор</span>
    <button data-edit="add-node">+ Навык</button>
    <button data-edit="add-tree">+ Ветка</button>
    <button data-edit="export">Экспорт JSON</button>
    <button data-edit="import">Импорт</button>
    <button data-edit="revert" id="revertBtn">Вернуть исходную карту</button>
    <span class="editbar-hint">Тащи навыки мышью · Shift + клик по навыку делает его требованием для выбранного</span>
  </div>

  <nav id="legend" aria-label="Ветки">
    <button id="legendToggle" class="legend-head" aria-expanded="true"><span>Ветки</span><span id="legendTotal" class="mono"></span></button>
    <div id="legendList"></div>
  </nav>

  <div id="zoom">
    <button data-zoom="in" title="Приблизить">+</button>
    <button data-zoom="out" title="Отдалить">−</button>
    <button data-zoom="fit" title="Вся карта">⤢</button>
  </div>

  <aside id="panel" aria-live="polite" hidden>
    <button id="panelClose" class="panel-close" title="Закрыть">✕</button>
    <div id="panelBody"></div>
  </aside>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>

<script>/*DATA*/</script>
<script>/*SCRIPT*/</script>
