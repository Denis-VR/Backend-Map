<title>GameTree</title>
<meta name="description" content="Карта навыков как в XMind: темы по линии, вопросы по сложности, отмечай изученное и повторяй.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Oswald:wght@300;400;500&display=swap">
<style>/*STYLE*/</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-review" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7v.5"/><circle cx="12" cy="17.2" r=".6"/></symbol>
  <symbol id="i-dive" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
  <symbol id="i-start" viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M19 12H9"/><path d="M13 8l-4 4 4 4"/></symbol>
</svg>

<div id="app">
  <canvas id="stars" aria-hidden="true"></canvas>
  <svg id="map" role="application" aria-label="Карта навыков" tabindex="0">
    <g id="world">
      <g id="layer-edges"></g>
      <g id="layer-link"></g>
      <g id="layer-nodes"></g>
      <g id="layer-fx"></g>
    </g>
    <g id="inner" hidden>
      <g id="inner-edges"></g>
      <g id="inner-nodes"></g>
    </g>
  </svg>

  <header id="hud">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">GameTree</span></div>
    <div class="project-switch">
      <button id="projectBtn" class="chip" aria-haspopup="menu" aria-expanded="false"><span id="projectTitle">…</span><svg class="ic sm"><use href="#i-chevron"/></svg></button>
      <div id="projectMenu" class="menu" role="menu" hidden></div>
    </div>
    <div class="search">
      <svg class="ic sm search-ic"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Поиск темы или вопроса" autocomplete="off" aria-label="Поиск">
      <div id="searchResults" class="menu" hidden></div>
    </div>
    <div class="hud-right">
      <div class="level" id="level" title="Опыт">
        <div class="level-badge"><span id="levelNum">1</span></div>
        <div class="level-meta">
          <div class="level-title" id="levelTitle">Стажёр</div>
          <div class="xpbar"><div id="xpFill"></div></div>
        </div>
        <div class="xp-text mono" id="xpText">0 XP</div>
      </div>
      <button id="reviewBtn" class="chip" title="Повторение"><svg class="ic"><use href="#i-review"/></svg><span class="lbl-wide">Повторение</span><span id="reviewCount" class="count" hidden></span></button>
      <div class="more">
        <button id="moreBtn" class="chip icon" aria-haspopup="menu" aria-expanded="false" title="Ещё"><svg class="ic"><use href="#i-more"/></svg></button>
        <div id="moreMenu" class="menu right" role="menu" hidden>
          <button data-act="export-project">Экспорт карты в JSON</button>
          <button data-act="import">Импорт карты или прогресса</button>
          <button data-act="export-progress">Сохранить прогресс в файл</button>
          <button data-act="onboarding">Отметить изученные темы</button>
          <button data-act="add-tree">Новая тема</button>
          <button data-act="help">Управление</button>
          <hr>
          <button data-act="revert" id="revertBtn">Вернуть исходную карту</button>
          <button data-act="reset-progress" class="danger">Сбросить прогресс</button>
        </div>
      </div>
    </div>
  </header>

  <nav id="crumbs" hidden>
    <button id="backBtn" class="chip"><svg class="ic"><use href="#i-back"/></svg><span>К карте</span></button>
    <div class="crumb-path" id="crumbPath"></div>
    <div class="crumb-stat mono" id="crumbStat"></div>
  </nav>

  <nav id="legend" aria-label="Темы">
    <button id="legendToggle" class="legend-head" aria-expanded="true"><span>Темы</span><span id="legendTotal" class="mono"></span></button>
    <div id="levelKey" class="level-key" aria-label="Сложность вопросов"></div>
    <div id="legendList"></div>
  </nav>

  <div id="dock">
    <button data-zoom="undo" title="Отменить (Ctrl+Z)"><svg class="ic"><use href="#i-undo"/></svg></button>
    <button data-zoom="redo" title="Повторить (Ctrl+Shift+Z)"><svg class="ic"><use href="#i-redo"/></svg></button>
    <span class="dock-sep"></span>
    <button data-zoom="out" title="Отдалить (−)"><svg class="ic"><use href="#i-minus"/></svg></button>
    <button data-zoom="in" title="Приблизить (+)"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button data-zoom="start" title="К началу линии"><svg class="ic"><use href="#i-start"/></svg></button>
    <button data-zoom="fit" title="Показать всё (0)"><svg class="ic"><use href="#i-fit"/></svg></button>
    <span class="dock-sep"></span>
    <button data-zoom="help" title="Управление (?)"><svg class="ic"><use href="#i-help"/></svg></button>
  </div>

  <div id="hint" class="mono" aria-hidden="true"></div>

  <aside id="panel" aria-live="polite" hidden>
    <button id="panelClose" class="icon-btn panel-close" title="Закрыть"><svg class="ic"><use href="#i-close"/></svg></button>
    <div id="panelBody"></div>
  </aside>

  <div id="ctxMenu" class="menu ctx" role="menu" hidden></div>
  <textarea id="inlineEdit" class="inline-edit" rows="1" hidden spellcheck="false"></textarea>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" id="modalCard"></div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
</div>

<script>/*DATA*/</script>
<script>/*SCRIPT*/</script>
